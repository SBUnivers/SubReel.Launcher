name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SubReel.Launcher.slnx

      - name: Build Release
        run: dotnet build SubReel.Launcher.slnx --configuration Release --no-restore -m:1

      - name: Run tests
        run: dotnet test SubReel.Launcher.slnx --configuration Release --no-build --no-restore -m:1
